<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAN LUSTRE 光所計畫 - 案場工程管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jp-bg': '#F9F8F6',
                        'jp-paper': '#FFFFFF',
                        'jp-text': '#23211E',
                        'jp-muted': '#8C877D',
                        'jp-border': '#EFECE6',
                        'jp-accent': '#B08E6B',
                        'jp-success': '#7A9A8B',
                        'jp-warn': '#C88A75',
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body {
            background-color: #F9F8F6;
            color: #23211E;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.05em;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #EFECE6;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen bg-jp-bg text-jp-text pb-20" x-data="planLustreApp()" x-init="init()">

    <!-- Loading Overlay -->
    <div x-show="isLoading" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50" x-cloak>
        <div class="bg-jp-paper p-6 rounded shadow-lg flex items-center space-x-3 border border-jp-border">
            <svg class="animate-spin h-5 w-5 text-jp-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs text-jp-text font-medium">資料同步處理中...</span>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="bg-jp-paper border-b border-jp-border sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-jp-text text-jp-paper flex items-center justify-center font-bold text-xs tracking-widest">PL</div>
                <div>
                    <h1 class="text-base font-medium tracking-widest uppercase">PLAN LUSTRE</h1>
                    <p class="text-xs text-jp-muted tracking-wider">光所計畫室內裝修 | 案場管理系統</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <select x-model="currentProject" class="text-xs border border-jp-border rounded p-1.5 bg-jp-bg text-jp-text focus:outline-none">
                    <template x-for="p in projects" :key="p.id">
                        <option :value="p.id" x-text="p.name"></option>
                    </template>
                </select>
                <span class="text-xs px-2.5 py-1 rounded bg-jp-bg text-jp-muted border border-jp-border" x-text="isClient ? '業主專屬視角' : '後台管理模式'"></span>
                <button @click="isClient = !isClient" class="text-xs px-3 py-1.5 border border-jp-accent text-jp-accent hover:bg-jp-accent hover:text-white transition">
                    切換至<span x-text="isClient ? '管理後台' : '業主視角'"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-8 space-y-8">

        <!-- Banner / Task Alert & Notification -->
        <div x-show="pendingClientTasksCount > 0" class="bg-amber-50/80 border-l-4 border-jp-accent p-4 rounded shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="w-5 h-5 text-jp-accent flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <div>
                    <p class="text-xs font-medium text-jp-text">業主待辦提醒</p>
                    <p class="text-xs text-jp-muted mt-0.5">目前有 <span class="font-bold text-jp-warn" x-text="pendingClientTasksCount"></span> 項待辦/工種安排事項等待確認。</p>
                </div>
            </div>
            <button @click="requestNotificationPermission()" class="text-xs bg-jp-accent text-white px-3 py-1.5 rounded hover:opacity-90 transition">
                開啟推播提醒
            </button>
        </div>

        <!-- 1. 財務與基本資訊 (Financial Overview) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-jp-paper p-6 border border-jp-border rounded">
                <div class="flex justify-between items-center">
                    <p class="text-xs text-jp-muted tracking-wider">工程總合約金額</p>
                    <template x-if="!isClient">
                        <button @click="updateContractAmount()" class="text-xs text-jp-accent hover:underline">儲存修改</button>
                    </template>
                </div>
                <template x-if="!isClient">
                    <input type="number" x-model.number="getActiveProject().contractAmount" class="text-2xl font-light text-jp-text bg-transparent border-b border-jp-border mt-2 w-full focus:outline-none focus:border-jp-accent">
                </template>
                <template x-if="isClient">
                    <p class="text-2xl font-light mt-2" x-text="'NT$ ' + formatNumber(getActiveProject().contractAmount)"></p>
                </template>
            </div>

            <div class="bg-jp-paper p-6 border border-jp-border rounded">
                <p class="text-xs text-jp-muted tracking-wider">業主已付款項</p>
                <p class="text-2xl font-light text-jp-success mt-2" x-text="'NT$ ' + formatNumber(getActiveProject().receivedAmount)"></p>
            </div>

            <div class="bg-jp-paper p-6 border border-jp-border rounded">
                <p class="text-xs text-jp-muted tracking-wider">未收結算尾款</p>
                <p class="text-2xl font-light text-jp-warn mt-2" x-text="'NT$ ' + formatNumber(getActiveProject().contractAmount - getActiveProject().receivedAmount)"></p>
            </div>
        </div>

        <!-- 2. 業主待辦事項與工種安排 (Client Action Items) -->
        <section class="bg-jp-paper border border-jp-border rounded p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-jp-border pb-3">
                <div>
                    <h2 class="text-base font-medium tracking-wide flex items-center space-x-2">
                        <span>業主待辦事項與工種安排</span>
                        <span class="text-xs bg-jp-accent/10 text-jp-accent px-2 py-0.5 rounded-full" x-text="filteredClientTasks().length + ' 項'"></span>
                    </h2>
                    <p class="text-xs text-jp-muted mt-1">配合事項提醒與廠商進場確認（業主可在此點擊回報）</p>
                </div>
                <template x-if="!isClient">
                    <button @click="showAddTaskModal = true" class="text-xs bg-jp-accent text-white px-3 py-1.5 rounded hover:opacity-90 transition">
                        + 新增待辦/工種提醒
                    </button>
                </template>
            </div>

            <div class="space-y-3">
                <template x-for="task in filteredClientTasks()" :key="task.id">
                    <div class="p-4 border rounded flex flex-col md:flex-row md:items-center justify-between gap-4 transition" :class="task.completed ? 'bg-jp-bg/50 border-jp-border' : 'bg-jp-paper border-jp-accent/30 shadow-sm'">
                        <div class="flex items-start space-x-3">
                            <input type="checkbox" :checked="task.completed" @change="toggleClientTask(task)" class="mt-1 w-4 h-4 text-jp-accent border-jp-border rounded focus:ring-jp-accent">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-sm font-medium" :class="task.completed ? 'line-through text-jp-muted' : 'text-jp-text'" x-text="task.title"></span>
                                    <span class="text-xs px-2 py-0.5 rounded" :class="task.completed ? 'bg-jp-success/10 text-jp-success' : 'bg-jp-warn/10 text-jp-warn'" x-text="task.completed ? '已安排/已完成' : '待安排'"></span>
                                </div>
                                <p class="text-xs text-jp-muted mt-1" x-text="'預定日期：' + formatDate(task.dueDate)"></p>
                                <p class="text-xs text-jp-text/80 mt-1" x-show="task.note" x-text="'備註：' + task.note"></p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2 self-end md:self-center">
                            <button @click="toggleClientTask(task)" class="text-xs px-3 py-1.5 rounded border transition" :class="task.completed ? 'border-jp-border text-jp-muted hover:bg-jp-bg' : 'border-jp-accent text-jp-accent hover:bg-jp-accent hover:text-white'">
                                <span x-text="task.completed ? '改為待處理' : '回報已安排'"></span>
                            </button>
                            <template x-if="!isClient">
                                <button @click="deleteClientTask(task.id)" class="text-xs text-jp-warn hover:underline px-2 py-1">刪除</button>
                            </template>
                        </div>
                    </div>
                </template>
                <template x-if="filteredClientTasks().length === 0">
                    <p class="text-xs text-jp-muted text-center py-6">目前無待確認事項</p>
                </template>
            </div>
        </section>

        <!-- 3. 施工進度時間軸 (Sorted: Earliest to Latest Date) -->
        <section class="bg-jp-paper border border-jp-border rounded p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-jp-border pb-3">
                <div>
                    <h2 class="text-base font-medium tracking-wide">施工進度時間軸</h2>
                    <p class="text-xs text-jp-muted mt-1">按開工日期（由早至晚排序）</p>
                </div>
                <template x-if="!isClient">
                    <button @click="showAddScheduleModal = true" class="text-xs border border-jp-text text-jp-text px-3 py-1.5 rounded hover:bg-jp-text hover:text-white transition">
                        + 新增工程階段
                    </button>
                </template>
            </div>

            <!-- Timeline -->
            <div class="relative border-l-2 border-jp-border ml-3 pl-6 space-y-6">
                <template x-for="item in sortedSchedules" :key="item.id">
                    <div class="relative">
                        <!-- Dot -->
                        <div class="absolute -left-[31px] top-1.5 w-3 h-3 rounded-full border-2 border-jp-paper" :class="{
                            'bg-jp-success': item.status === '已完成',
                            'bg-jp-accent': item.status === '進行中',
                            'bg-jp-border': item.status === '未開始'
                        }"></div>

                        <div class="bg-jp-bg/40 p-4 rounded border border-jp-border flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs px-2 py-0.5 rounded text-white" :class="{
                                        'bg-jp-success': item.status === '已完成',
                                        'bg-jp-accent': item.status === '進行中',
                                        'bg-jp-muted': item.status === '未開始'
                                    }" x-text="item.status"></span>
                                    <h3 class="text-sm font-medium" x-text="item.task"></h3>
                                </div>
                                <p class="text-xs text-jp-muted mt-2" x-text="formatDate(item.startDate) + ' ～ ' + formatDate(item.endDate)"></p>
                            </div>
                            <template x-if="!isClient">
                                <div class="flex items-center space-x-2">
                                    <button @click="deleteScheduleItem(item.id)" class="text-xs text-jp-warn hover:underline">刪除</button>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <template x-if="sortedSchedules.length === 0">
                    <p class="text-xs text-jp-muted py-4">尚無進度排程</p>
                </template>
            </div>
        </section>

        <!-- 4. 現場反饋與問題排查 (Defects / Feedbacks) -->
        <section class="bg-jp-paper border border-jp-border rounded p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-jp-border pb-3">
                <div>
                    <h2 class="text-base font-medium tracking-wide">現場反饋與問題記錄</h2>
                    <p class="text-xs text-jp-muted mt-1">現場照片與改善回報紀錄</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="p-4 bg-jp-bg/50 border border-jp-border rounded space-y-3">
                    <p class="text-xs font-medium text-jp-text">提交現場狀況/問題</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <input type="text" x-model="newDefect.item" placeholder="項目說明（例：玄關磁磚瑕疵）" class="p-2 border border-jp-border rounded bg-white">
                        <input type="file" @change="handleDefectPhotoSelect" accept="image/*" class="p-1 border border-jp-border rounded bg-white">
                    </div>
                    <textarea x-model="newDefect.note" placeholder="詳細備註說明..." class="w-full p-2 text-xs border border-jp-border rounded bg-white h-16"></textarea>
                    <button @click="addDefectFeedback()" class="text-xs bg-jp-accent text-white px-4 py-2 rounded hover:opacity-90 transition">
                        上傳現場反饋
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="defect in filteredDefects()" :key="defect.id">
                        <div class="p-4 border border-jp-border rounded bg-white space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="text-sm font-medium" x-text="defect.item"></span>
                                <span class="text-xs px-2 py-0.5 rounded" :class="defect.status === '已處理' ? 'bg-jp-success/10 text-jp-success' : 'bg-jp-warn/10 text-jp-warn'" x-text="defect.status"></span>
                            </div>
                            <p class="text-xs text-jp-muted" x-text="defect.note"></p>
                            <template x-if="defect.url">
                                <img :src="defect.url" @click="openSingleImage(defect.url)" class="w-full h-40 object-cover rounded border border-jp-border cursor-pointer hover:opacity-95">
                            </template>
                            <template x-if="!isClient">
                                <div class="pt-2 border-t border-jp-border flex justify-between items-center">
                                    <select x-model="defect.status" @change="updateDefectStatus(defect)" class="text-xs border border-jp-border rounded p-1 bg-jp-bg">
                                        <option value="待處理">待處理</option>
                                        <option value="處理中">處理中</option>
                                        <option value="已處理">已處理</option>
                                    </select>
                                    <button @click="deleteDefectItem(defect.id)" class="text-xs text-jp-warn hover:underline">刪除</button>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal: 新增待辦/工種 -->
    <div x-show="showAddTaskModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-jp-paper rounded max-w-md w-full p-6 space-y-4 border border-jp-border">
            <h3 class="text-sm font-medium">新增業主待辦/工種提醒</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-jp-muted mb-1">事項名稱 / 配合工種</label>
                    <input type="text" x-model="newClientTask.title" placeholder="例：選定浴室磁磚顏色 / 冷氣廠商進場配合" class="w-full p-2 border border-jp-border rounded">
                </div>
                <div>
                    <label class="block text-jp-muted mb-1">預定日期</label>
                    <input type="date" x-model="newClientTask.dueDate" class="w-full p-2 border border-jp-border rounded">
                </div>
                <div>
                    <label class="block text-jp-muted mb-1">備註說明</label>
                    <textarea x-model="newClientTask.note" placeholder="例：請提供尺寸給設計師" class="w-full p-2 border border-jp-border rounded h-20"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showAddTaskModal = false" class="text-xs px-3 py-1.5 border border-jp-border rounded">取消</button>
                <button @click="addClientTask()" class="text-xs bg-jp-accent text-white px-3 py-1.5 rounded">確認新增</button>
            </div>
        </div>
    </div>

    <!-- Modal: 新增工程階段 -->
    <div x-show="showAddScheduleModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-jp-paper rounded max-w-md w-full p-6 space-y-4 border border-jp-border">
            <h3 class="text-sm font-medium">新增工程階段</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-jp-muted mb-1">階段名稱</label>
                    <input type="text" x-model="newSchedule.task" placeholder="例：保護與拆除工程" class="w-full p-2 border border-jp-border rounded">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-jp-muted mb-1">開始日期</label>
                        <input type="date" x-model="newSchedule.startDate" class="w-full p-2 border border-jp-border rounded">
                    </div>
                    <div>
                        <label class="block text-jp-muted mb-1">結束日期</label>
                        <input type="date" x-model="newSchedule.endDate" class="w-full p-2 border border-jp-border rounded">
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showAddScheduleModal = false" class="text-xs px-3 py-1.5 border border-jp-border rounded">取消</button>
                <button @click="addScheduleItem()" class="text-xs bg-jp-text text-white px-3 py-1.5 rounded">確認新增</button>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby4qYqNCSvRldLAk4yY9i7TrJWT1x5uuSv-b8QN5Z2sgdYEcNkYzNB6yUlbxylbsNL_5A/exec'; // 請替換為您的 GAS Web App API 網址

        function planLustreApp() {
            return {
                isLoading: false,
                isClient: false,
                currentProject: '1',
                showAddTaskModal: false,
                showAddScheduleModal: false,

                projects: [
                    { id: '1', name: '光所計畫 - 示範案場', contractAmount: 1250000, receivedAmount: 500000 }
                ],
                documents: [],
                defects: [],
                schedules: [],
                entries: [],
                clientTasks: [],

                newClientTask: { title: '', dueDate: '', note: '' },
                newDefect: { item: '', note: '', base64Photo: '' },
                selectedDefectPhotoName: '',
                newSchedule: { task: '', startDate: '', endDate: '', status: '未開始' },
                newEntry: { type: 'expense', item: '', amount: null },

                async init() {
                    // 初始化可在此向 API_URL 載入雲端資料
                },

                getActiveProject() {
                    return this.projects.find(p => String(p.id) === String(this.currentProject)) || { contractAmount: 0, receivedAmount: 0 };
                },

                get sortedSchedules() {
                    return [...this.filteredSchedules()].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
                },

                get pendingClientTasksCount() {
                    return this.filteredClientTasks().filter(t => !t.completed).length;
                },

                filteredSchedules() { return this.schedules.filter(s => String(s.projectId) === String(this.currentProject)); },
                filteredDefects() { return this.defects.filter(d => String(d.projectId) === String(this.currentProject)); },
                filteredEntries() { return this.entries.filter(e => String(e.projectId) === String(this.currentProject)); },
                filteredClientTasks() { return this.clientTasks.filter(t => String(t.projectId) === String(this.currentProject)); },

                async addClientTask() {
                    if (!this.newClientTask.title || !this.newClientTask.dueDate) { alert("請填寫事項名稱與預定日期"); return; }
                    this.isLoading = true;
                    const taskToAdd = {
                        id: String(Date.now()),
                        projectId: String(this.currentProject),
                        title: this.newClientTask.title,
                        dueDate: this.newClientTask.dueDate,
                        note: this.newClientTask.note,
                        completed: false
                    };
                    try {
                        this.clientTasks.push(taskToAdd);
                        if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addClientTask', data: taskToAdd }) });
                        }
                        this.newClientTask = { title: '', dueDate: '', note: '' };
                        this.showAddTaskModal = false;
                    } catch (e) {
                        alert("新增失敗");
                    } finally {
                        this.isLoading = false;
                    }
                },

                async toggleClientTask(task) {
                    task.completed = !task.completed;
                    if (task.completed) {
                        this.sendNotification("PLAN LUSTRE 回報通知", `已完成/安排：${task.title}`);
                    }
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateClientTask', data: { id: String(task.id), completed: task.completed } }) });
                    }
                },

                async deleteClientTask(id) {
                    if (!confirm("確定要刪除此項提醒？")) return;
                    const targetId = String(id);
                    this.clientTasks = this.clientTasks.filter(t => String(t.id) !== targetId);
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteClientTask', id: targetId }) });
                    }
                },

                requestNotificationPermission() {
                    if (!("Notification" in window)) {
                        alert("您的瀏覽器不支援桌面推播");
                        return;
                    }
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            this.sendNotification("PLAN LUSTRE 系統通知", "推播提醒功能已成功開啟！");
                        } else {
                            alert("已拒絕推播權限");
                        }
                    });
                },

                sendNotification(title, body) {
                    if (("Notification" in window) && Notification.permission === "granted") {
                        new Notification(title, { body: body, icon: "https://fav.farm/✨" });
                    }
                },

                handleDefectPhotoSelect(e) {
                    const file = e.target.files[0];
                    if (file) {
                        this.selectedDefectPhotoName = file.name;
                        const reader = new FileReader();
                        reader.onload = (evt) => { this.newDefect.base64Photo = evt.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                async addDefectFeedback() {
                    if (!this.newDefect.item) { alert("請填寫項目說明"); return; }
                    this.isLoading = true;
                    const dataToAdd = { id: String(Date.now()), projectId: String(this.currentProject), item: this.newDefect.item, note: this.newDefect.note, status: '待處理', base64Photo: this.newDefect.base64Photo };
                    try {
                        this.defects.unshift({ ...dataToAdd, url: this.newDefect.base64Photo || '' });
                        if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addDefect', data: dataToAdd }) });
                        }
                        this.newDefect = { item: '', note: '', base64Photo: '' };
                    } catch (e) { alert("失敗"); } finally { this.isLoading = false; }
                },

                async updateDefectStatus(item) {
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateDefect', data: { id: String(item.id), status: item.status } }) });
                    }
                },

                async deleteDefectItem(id) {
                    if (!confirm("確定要刪除？")) return;
                    this.defects = this.defects.filter(d => String(d.id) !== String(id));
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteDefect', id: String(id) }) });
                    }
                },

                async addScheduleItem() {
                    if (!this.newSchedule.task || !this.newSchedule.startDate) { alert("請填寫階段名稱與開始日期"); return; }
                    this.isLoading = true;
                    const itemToAdd = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newSchedule };
                    try {
                        this.schedules.push(itemToAdd);
                        if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addSchedule', data: itemToAdd }) });
                        }
                        this.newSchedule = { task: '', startDate: '', endDate: '', status: '未開始' };
                        this.showAddScheduleModal = false;
                    } catch (e) { alert("失敗"); } finally { this.isLoading = false; }
                },

                async deleteScheduleItem(id) {
                    this.schedules = this.schedules.filter(s => String(s.id) !== String(id));
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteSchedule', id: String(id) }) });
                    }
                },

                async updateContractAmount() {
                    if (API_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateContractAmount', id: String(this.currentProject), amount: this.getActiveProject().contractAmount }) });
                    }
                    alert("合約金額已更新！");
                },

                openSingleImage(url) { window.open(url, '_blank'); },
                formatNumber(num) { return (Number(num) || 0).toLocaleString(); },
                formatDate(d) { return d ? d.split('T')[0] : ''; }
            }
        }
    </script>
</body>
</html>
