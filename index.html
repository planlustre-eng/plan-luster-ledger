<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luster OS - PLAN LUSTRE 案場管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            japanese: {
              bg: '#FBFBFA', paper: '#FFFFFF', text: '#2C2A29',
              muted: '#7E7A74', border: '#E8E6E1', accent: '#C4A482',
              success: '#8FA499', warn: '#D1A18C', btn: '#4A4643'
            }
          },
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FBFBFA; color: #2C2A29; letter-spacing: 0.05em; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
    button, input, select { touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans" x-data="lusterApp()" x-init="fetchData()">

  <!-- 頂部導覽列 -->
  <header class="border-b border-japanese-border bg-japanese-paper sticky top-0 z-40 px-4 py-3 flex flex-wrap items-center justify-between gap-2 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-2.5 h-2.5 rounded-full" :class="isLoading ? 'bg-japanese-warn animate-ping' : 'bg-japanese-accent'"></div>
      <span class="font-medium tracking-widest text-xs sm:text-sm text-japanese-text">PLAN LUSTRE</span>
      
      <!-- 無 Icon 切換按鈕 -->
      <button x-show="!isClientOnly" @click="viewMode = viewMode === 'admin' ? 'client' : 'admin'" 
              class="ml-1 text-[11px] px-2.5 py-1 rounded-full border border-japanese-accent/60 text-japanese-accent active:bg-japanese-accent active:text-white transition-all font-medium">
        <span x-text="viewMode === 'admin' ? '切換業主視角' : '切換內部管理'"></span>
      </button>
    </div>

    <!-- 選擇案場、新增與刪除案場 -->
    <div class="flex items-center space-x-1.5 text-xs">
      <select class="bg-japanese-bg border border-japanese-border rounded-lg px-2.5 py-1.5 text-xs text-japanese-text focus:outline-none max-w-[130px] sm:max-w-none truncate" x-model="currentProject">
        <template x-for="proj in projects" :key="proj.id">
          <option :value="proj.id" x-text="proj.name"></option>
        </template>
      </select>
      
      <!-- 內部管理模式下顯示新增/刪除案場 -->
      <template x-if="viewMode === 'admin'">
        <div class="flex space-x-1 shrink-0">
          <button @click="showProjectModal = true" class="bg-japanese-btn text-white px-2.5 py-1.5 rounded-lg text-xs font-medium active:scale-95 transition-all cursor-pointer">
            + 案場
          </button>
          <button @click="deleteCurrentProject()" class="border border-japanese-warn text-japanese-warn px-2 py-1.5 rounded-lg text-xs hover:bg-japanese-warn hover:text-white active:scale-95 transition-all cursor-pointer" title="刪除當前案場">
            ✕ 刪除
          </button>
        </div>
      </template>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- ================== 內部管理模式 (ADMIN VIEW) ================== -->
    <template x-if="viewMode === 'admin'">
      <div class="space-y-6">
        <!-- Tab 切換 -->
        <div class="flex border-b border-japanese-border text-xs space-x-6 overflow-x-auto">
          <button @click="activeTab = 'finance'" :class="activeTab === 'finance' ? 'border-b-2 border-japanese-accent text-japanese-text font-bold py-2' : 'text-japanese-muted py-2'" class="whitespace-nowrap">帳務概況</button>
          <button @click="activeTab = 'schedule'" :class="activeTab === 'schedule' ? 'border-b-2 border-japanese-accent text-japanese-text font-bold py-2' : 'text-japanese-muted py-2'" class="whitespace-nowrap">工程進度表</button>
          <button @click="activeTab = 'defects'" :class="activeTab === 'defects' ? 'border-b-2 border-japanese-accent text-japanese-text font-bold py-2' : 'text-japanese-muted py-2'" class="whitespace-nowrap">業主備註與回覆 (<span x-text="filteredDefects().length"></span>)</button>
          <button @click="activeTab = 'docs'" :class="activeTab === 'docs' ? 'border-b-2 border-japanese-accent text-japanese-text font-bold py-2' : 'text-japanese-muted py-2'" class="whitespace-nowrap">文件管理</button>
        </div>

        <!-- 頁籤 1：帳務概況 -->
        <div x-show="activeTab === 'finance'" class="space-y-6">
          <section class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-japanese-paper border border-japanese-border p-4 rounded-xl shadow-sm">
              <span class="text-[10px] text-japanese-muted block mb-1">CONTRACT / 合約金額</span>
              <div class="text-base sm:text-lg font-light" x-text="'$ ' + formatNumber(getActiveProject().contractAmount)"></div>
            </div>
            <div class="bg-japanese-paper border border-japanese-border p-4 rounded-xl shadow-sm">
              <span class="text-[10px] text-japanese-muted block mb-1">RECEIVED / 已收款</span>
              <div class="text-base sm:text-lg font-light text-japanese-success" x-text="'$ ' + formatNumber(getActiveProject().receivedAmount)"></div>
            </div>
            <div class="bg-japanese-paper border border-japanese-border p-4 rounded-xl shadow-sm">
              <span class="text-[10px] text-japanese-muted block mb-1">EXPENSES / 已發包成本</span>
              <div class="text-base sm:text-lg font-light" x-text="'$ ' + formatNumber(calculateTotalExpenses())"></div>
            </div>
            <div class="bg-japanese-paper border border-japanese-accent/40 p-4 rounded-xl shadow-sm bg-japanese-accent/5">
              <span class="text-[10px] text-japanese-accent block mb-1 font-medium">PROFIT / 估算毛利 (%)</span>
              <div class="text-base sm:text-lg font-medium text-japanese-accent">
                <span x-text="'$ ' + formatNumber(calculateProfit())"></span>
                <span class="text-xs font-normal ml-1" x-text="'(' + calculateProfitMargin() + '%)'"></span>
              </div>
            </div>
          </section>

          <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
              <h2 class="text-xs font-medium tracking-wider text-japanese-text">NEW ENTRY / 新增收支</h2>
              <form @submit.prevent="addEntry()" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" @click="newEntry.type = 'expense'" :class="newEntry.type === 'expense' ? 'bg-japanese-btn text-white font-medium' : 'border border-japanese-border text-japanese-muted'" class="py-2 text-xs rounded-lg active:scale-95 transition-all">支出 (發包/材料)</button>
                  <button type="button" @click="newEntry.type = 'income'" :class="newEntry.type === 'income' ? 'bg-japanese-accent text-white font-medium' : 'border border-japanese-border text-japanese-muted'" class="py-2 text-xs rounded-lg active:scale-95 transition-all">收入 (業主請款)</button>
                </div>

                <div>
                  <label class="block text-[10px] text-japanese-muted mb-1">品項說明</label>
                  <input type="text" x-model="newEntry.item" placeholder="請輸入品項 (如: 木作一期)" required class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none focus:border-japanese-accent">
                </div>

                <div>
                  <label class="block text-[10px] text-japanese-muted mb-1">金額 (NTD)</label>
                  <input type="number" inputmode="numeric" pattern="[0-9]*" x-model.number="newEntry.amount" placeholder="0" required min="1" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none focus:border-japanese-accent">
                </div>

                <div>
                  <label class="block text-[10px] text-japanese-muted mb-1">日期</label>
                  <input type="date" x-model="newEntry.date" required class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
                </div>

                <div>
                  <label class="block text-[10px] text-japanese-muted mb-1">經手人 / 廠商備註</label>
                  <input type="text" x-model="newEntry.partner" placeholder="例如：阿昌師" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
                </div>

                <button type="submit" :disabled="isLoading" class="w-full bg-japanese-btn hover:bg-black text-white py-2.5 rounded-lg text-xs font-medium tracking-widest active:scale-98 transition-all cursor-pointer">
                  <span x-text="isLoading ? '儲存中...' : '送出帳目 ENTER'"></span>
                </button>
              </form>
            </div>

            <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm lg:col-span-2 flex flex-col h-[420px]">
              <h2 class="text-xs font-medium tracking-wider text-japanese-text mb-4">LEDGER DETAIL / 帳目明細</h2>
              <div class="flex-1 overflow-y-auto space-y-2 pr-1">
                <template x-for="item in filteredEntries()" :key="item.id">
                  <div class="flex items-center justify-between p-3 bg-japanese-bg rounded-lg border border-japanese-border/50 text-xs">
                    <div>
                      <div class="font-medium text-japanese-text" x-text="item.item"></div>
                      <div class="text-[10px] text-japanese-muted mt-0.5" x-text="formatDate(item.date) + (item.partner ? ' • ' + item.partner : '')"></div>
                    </div>
                    <div class="flex items-center space-x-3">
                      <span class="font-medium" :class="item.type === 'income' ? 'text-japanese-accent' : 'text-japanese-text'" x-text="(item.type === 'income' ? '+' : '-') + ' $' + formatNumber(item.amount)"></span>
                      <button @click="deleteEntry(item.id)" class="text-japanese-muted hover:text-japanese-warn p-1">✕</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </div>

        <!-- 頁籤 2：工程時間軸 (支援左滑刪除) -->
        <div x-show="activeTab === 'schedule'" class="space-y-6">
          <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
            <div class="flex justify-between items-center">
              <div>
                <h2 class="text-xs font-medium tracking-wider text-japanese-text">SCHEDULE TIMELINE / 工程時間軸</h2>
                <p class="text-[10px] text-japanese-muted mt-0.5">提示：在工期項目上「向左滑動」可拉出刪除按鈕</p>
              </div>
              <button @click="showScheduleModal = true" class="bg-japanese-btn text-white px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 cursor-pointer shrink-0">+ 新增工期</button>
            </div>

            <div class="relative pl-6 space-y-4 before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-japanese-border overflow-hidden">
              <template x-for="task in filteredSchedules()" :key="task.id">
                <div class="relative overflow-hidden rounded-lg">
                  <!-- 滑動背後的刪除按鈕 -->
                  <div class="absolute inset-y-0 right-0 w-20 bg-japanese-warn text-white text-xs flex items-center justify-center font-medium cursor-pointer" @click="deleteSchedule(task.id)">
                    刪除
                  </div>

                  <!-- 可滑動的主卡片 -->
                  <div class="relative bg-japanese-bg p-3.5 border border-japanese-border flex items-center justify-between transition-transform duration-200 ease-out"
                       :style="'transform: translateX(' + (swipedScheduleId === task.id ? '-80px' : '0px') + ')'"
                       @touchstart="touchStart($event)"
                       @touchend="touchEnd($event, task.id)">
                    
                    <div class="absolute -left-6 top-4 w-2.5 h-2.5 rounded-full border-2 border-white" :class="task.status === '已完成' ? 'bg-japanese-success' : 'bg-japanese-accent'"></div>
                    
                    <div>
                      <div class="text-xs font-medium text-japanese-text" x-text="task.task"></div>
                      <div class="text-[10px] text-japanese-muted mt-1" x-text="formatDate(task.startDate) + ' ～ ' + formatDate(task.endDate)"></div>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                      <span class="text-[10px] px-2 py-0.5 rounded" :class="task.status === '已完成' ? 'bg-japanese-success/20 text-japanese-success' : 'bg-japanese-accent/20 text-japanese-accent'" x-text="task.status"></span>
                      <!-- 桌機版顯示小刪除叉叉 -->
                      <button @click.stop="deleteSchedule(task.id)" class="hidden sm:inline-block text-japanese-muted hover:text-japanese-warn text-xs px-1">✕</button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- 頁籤 3：業主備註與即時回覆 (修復跑版問題) -->
        <div x-show="activeTab === 'defects'" class="space-y-6">
          <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
            <h2 class="text-xs font-medium tracking-wider text-japanese-text">DEFECTS & REPLIES / 業主回報事項與處理</h2>
            <div class="space-y-3">
              <template x-for="defect in filteredDefects()" :key="defect.id">
                <div class="bg-japanese-bg p-4 rounded-lg border border-japanese-border space-y-3">
                  <div class="flex justify-between items-start">
                    <div>
                      <span class="text-xs font-medium text-japanese-text" x-text="defect.item"></span>
                      <p class="text-xs text-japanese-muted font-light mt-0.5" x-text="defect.note"></p>
                    </div>
                    <select x-model="defect.status" @change="updateDefect(defect)" class="text-[11px] px-2 py-1 rounded border border-japanese-border bg-white outline-none">
                      <option value="待處理">待處理</option>
                      <option value="改善中">改善中</option>
                      <option value="已改善">已改善</option>
                    </select>
                  </div>

                  <!-- 修正跑版：採用 flex-col / sm:flex-row 彈性排版，防止黑框爆出 -->
                  <div class="flex flex-col sm:flex-row gap-2 pt-2 border-t border-japanese-border/50">
                    <input type="text" x-model="defect.reply" placeholder="輸入給業主的回覆內容..." class="flex-1 bg-white border border-japanese-border rounded px-3 py-1.5 text-xs outline-none focus:border-japanese-accent">
                    <button @click="updateDefect(defect)" class="bg-japanese-btn hover:bg-black text-white px-4 py-1.5 rounded text-xs shrink-0 active:scale-95 transition-all cursor-pointer w-full sm:w-auto">
                      更新狀態/回覆
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- 頁籤 4：業主文件管理 -->
        <div x-show="activeTab === 'docs'" class="space-y-6">
          <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b border-japanese-border pb-2">
              <h2 class="text-xs font-medium tracking-wider text-japanese-text">DOCUMENTS / 業主文件專區</h2>
              <button @click="showDocModal = true" class="bg-japanese-btn text-white px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 cursor-pointer">+ 新增文件連結</button>
            </div>
            <div class="space-y-2">
              <template x-for="doc in filteredDocuments()" :key="doc.id">
                <div class="flex items-center justify-between p-3 bg-japanese-bg rounded-lg border border-japanese-border">
                  <div>
                    <span class="text-xs font-medium text-japanese-text" x-text="doc.title"></span>
                    <span class="text-[10px] text-japanese-muted ml-2" x-text="'[' + doc.category + ']'"></span>
                  </div>
                  <a :href="doc.url" target="_blank" class="text-xs text-japanese-accent underline font-medium">開啟連結</a>
                </div>
              </template>
            </div>
          </div>
        </div>

      </div>
    </template>

    <!-- ================== 業主專用視角 (CLIENT VIEW) ================== -->
    <template x-if="viewMode === 'client'">
      <div class="space-y-8">
        <div class="bg-japanese-paper border border-japanese-border p-6 rounded-xl text-center space-y-2 shadow-sm">
          <span class="text-[10px] tracking-widest text-japanese-accent font-medium">PROJECT STATUS</span>
          <h1 class="text-lg font-medium text-japanese-text" x-text="getActiveProject().name"></h1>
          <p class="text-xs text-japanese-muted font-light">感謝選擇 PLAN LUSTRE，以下為即時工程進度與現場記錄。</p>
        </div>

        <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
          <h2 class="text-xs font-medium tracking-wider text-japanese-text border-b border-japanese-border pb-2">01 / 工程時間軸 TIMELINE</h2>
          <div class="relative pl-6 space-y-4 before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-japanese-border">
            <template x-for="task in filteredSchedules()" :key="task.id">
              <div class="relative flex justify-between items-center bg-japanese-bg p-3.5 rounded-lg border border-japanese-border/60">
                <div class="absolute -left-6 w-2.5 h-2.5 rounded-full border-2 border-white" :class="task.status === '已完成' ? 'bg-japanese-success' : 'bg-japanese-accent'"></div>
                <div>
                  <div class="text-xs font-medium" x-text="task.task"></div>
                  <div class="text-[10px] text-japanese-muted mt-0.5" x-text="formatDate(task.startDate) + ' ～ ' + formatDate(task.endDate)"></div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded" :class="task.status === '已完成' ? 'bg-japanese-success/20 text-japanese-success' : 'bg-japanese-accent/20 text-japanese-accent'" x-text="task.status"></span>
              </div>
            </template>
          </div>
        </div>

        <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
          <div class="flex justify-between items-center border-b border-japanese-border pb-2">
            <h2 class="text-xs font-medium tracking-wider text-japanese-text">02 / 現場施工照片 PHOTOS</h2>
            <button @click="showPhotoModal = true" class="bg-japanese-btn text-white px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 cursor-pointer">上傳照片</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <template x-for="photo in filteredPhotos()" :key="photo.id">
              <div class="bg-japanese-bg border border-japanese-border rounded-lg overflow-hidden shadow-sm">
                <img :src="photo.url" class="w-full h-48 object-cover" alt="施工照片">
                <div class="p-3 space-y-1">
                  <div class="flex justify-between text-[10px] text-japanese-muted">
                    <span x-text="photo.category" class="font-medium text-japanese-text"></span>
                    <span x-text="formatDate(photo.date)"></span>
                  </div>
                  <p class="text-xs text-japanese-muted font-light truncate" x-text="photo.note"></p>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
          <div class="flex justify-between items-center border-b border-japanese-border pb-2">
            <h2 class="text-xs font-medium tracking-wider text-japanese-text">03 / 備註與待調整事項 DEFECTS & NOTES</h2>
            <button @click="showDefectModal = true" class="bg-japanese-btn text-white px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 cursor-pointer">+ 新增備註</button>
          </div>
          <div class="space-y-3">
            <template x-for="defect in filteredDefects()" :key="defect.id">
              <div class="p-3.5 bg-japanese-bg rounded-lg border border-japanese-border space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-medium text-japanese-text" x-text="defect.item"></span>
                  <span class="text-[10px] px-2 py-0.5 rounded" :class="defect.status === '已改善' ? 'bg-japanese-success/20 text-japanese-success' : 'bg-japanese-warn/20 text-japanese-warn'" x-text="defect.status"></span>
                </div>
                <p class="text-xs text-japanese-muted font-light" x-text="defect.note"></p>
                <template x-if="defect.reply">
                  <div class="bg-white p-2.5 rounded border border-japanese-accent/30 text-xs mt-2">
                    <span class="text-japanese-accent font-medium text-[10px] block">PLAN LUSTRE 團隊回覆：</span>
                    <span class="text-japanese-text" x-text="defect.reply"></span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div class="bg-japanese-paper border border-japanese-border p-5 rounded-xl shadow-sm space-y-4">
          <h2 class="text-xs font-medium tracking-wider text-japanese-text border-b border-japanese-border pb-2">04 / 相關文件下載 DOCUMENTS</h2>
          <div class="space-y-2">
            <template x-for="doc in filteredDocuments()" :key="doc.id">
              <div class="flex items-center justify-between p-3.5 bg-japanese-bg rounded-lg border border-japanese-border">
                <div>
                  <div class="text-xs font-medium text-japanese-text" x-text="doc.title"></div>
                  <div class="text-[10px] text-japanese-muted mt-0.5" x-text="doc.category"></div>
                </div>
                <a :href="doc.url" target="_blank" class="px-3 py-1 bg-japanese-btn text-white text-xs rounded-lg active:scale-95">點擊檢視/下載</a>
              </div>
            </template>
            <template x-if="filteredDocuments().length === 0">
              <p class="text-xs text-japanese-muted py-2">尚無可供下載的文件。</p>
            </template>
          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- 🪟 Modals -->

  <!-- 新增案場 -->
  <div x-show="showProjectModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-japanese-paper rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="text-xs font-medium text-japanese-text">NEW PROJECT / 新增案場</h3>
      <input type="text" x-model="newProject.name" placeholder="案場名稱" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="number" inputmode="numeric" pattern="[0-9]*" x-model.number="newProject.contractAmount" placeholder="合約總金額 NT$" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showProjectModal = false" class="px-4 py-2 border border-japanese-border text-xs rounded-lg">取消</button>
        <button @click="addProject()" class="px-4 py-2 bg-japanese-btn text-white text-xs rounded-lg active:scale-95">確認新增</button>
      </div>
    </div>
  </div>

  <!-- 新增工期 -->
  <div x-show="showScheduleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-japanese-paper rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="text-xs font-medium text-japanese-text">NEW SCHEDULE / 新增工期</h3>
      <input type="text" x-model="newSchedule.task" placeholder="工種/工程名稱" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <div class="grid grid-cols-2 gap-2">
        <input type="date" x-model="newSchedule.startDate" class="bg-japanese-bg border border-japanese-border rounded-lg px-2 py-2 text-xs outline-none">
        <input type="date" x-model="newSchedule.endDate" class="bg-japanese-bg border border-japanese-border rounded-lg px-2 py-2 text-xs outline-none">
      </div>
      <select x-model="newSchedule.status" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-2 py-2 text-xs outline-none">
        <option value="未開始">未開始</option>
        <option value="進行中">進行中</option>
        <option value="已完成">已完成</option>
      </select>
      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showScheduleModal = false" class="px-4 py-2 border border-japanese-border text-xs rounded-lg">取消</button>
        <button @click="addSchedule()" class="px-4 py-2 bg-japanese-btn text-white text-xs rounded-lg active:scale-95">新增行程</button>
      </div>
    </div>
  </div>

  <!-- 上傳照片 Modal（修復：可支援手機相簿匯入） -->
  <div x-show="showPhotoModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-japanese-paper rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="text-xs font-medium text-japanese-text">UPLOAD PHOTO / 上傳施工照片</h3>
      <div class="space-y-2">
        <label class="block text-[10px] text-japanese-muted">選擇照片 (相簿匯入或現場拍照)</label>
        <!-- 移除 capture 屬性，讓手機彈出選單選擇「相簿」或「拍照」 -->
        <input type="file" accept="image/*" @change="handleFileUpload($event)" class="w-full text-xs text-japanese-muted file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-japanese-btn file:text-white">
      </div>
      <input type="text" x-model="newPhoto.category" placeholder="工種 (如: 木作工程)" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="date" x-model="newPhoto.date" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="text" x-model="newPhoto.note" placeholder="照片說明備註" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showPhotoModal = false" class="px-4 py-2 border border-japanese-border text-xs rounded-lg">取消</button>
        <button @click="addPhoto()" :disabled="!newPhoto.url || isLoading" class="px-4 py-2 bg-japanese-btn text-white text-xs rounded-lg active:scale-95 disabled:bg-japanese-muted">
          <span x-text="isLoading ? '上傳中...' : '確認上傳'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 新增瑕疵 Modal -->
  <div x-show="showDefectModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-japanese-paper rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="text-xs font-medium text-japanese-text">NEW NOTE / 新增調整事項與備註</h3>
      <input type="text" x-model="newDefect.item" placeholder="項目 (如: 玄關油漆不平)" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="text" x-model="newDefect.note" placeholder="詳細說明" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showDefectModal = false" class="px-4 py-2 border border-japanese-border text-xs rounded-lg">取消</button>
        <button @click="addDefect()" class="px-4 py-2 bg-japanese-btn text-white text-xs rounded-lg active:scale-95">送出備註</button>
      </div>
    </div>
  </div>

  <!-- 新增文件連結 Modal -->
  <div x-show="showDocModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-japanese-paper rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="text-xs font-medium text-japanese-text">NEW DOCUMENT / 新增文件連結</h3>
      <input type="text" x-model="newDoc.title" placeholder="文件標題 (如: 設計合約書)" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="url" x-model="newDoc.url" placeholder="雲端網址 (Google Drive / PDF 等)" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <input type="text" x-model="newDoc.category" placeholder="分類 (如: 圖紙, 估價單, 合約)" class="w-full bg-japanese-bg border border-japanese-border rounded-lg px-3 py-2 text-xs outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showDocModal = false" class="px-4 py-2 border border-japanese-border text-xs rounded-lg">取消</button>
        <button @click="addDocument()" class="px-4 py-2 bg-japanese-btn text-white text-xs rounded-lg active:scale-95">新增文件</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-japanese-border py-6 text-center text-[10px] text-japanese-muted tracking-widest mt-auto">
    © 2026 PLAN LUSTRE. DESIGNED FOR INNER PEACE AND FINANCIAL CLARITY.
  </footer>

  <script>
    // ⚠️ 請填入你的 Google Apps Script 最新發布的網址
    const API_URL = "https://script.google.com/macros/s/AKfycby4qYqNCSvRldLAk4yY9i7TrJWT1x5uuSv-b8QN5Z2sgdYEcNkYzNB6yUlbxylbsNL_5A/exec";

    function lusterApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const clientModeRequested = urlParams.get('mode') === 'client';

      return {
        viewMode: clientModeRequested ? 'client' : 'admin',
        isClientOnly: clientModeRequested,
        activeTab: 'finance',
        currentProject: '',
        projects: [],
        entries: [],
        schedules: [],
        photos: [],
        defects: [],
        documents: [],
        isLoading: false,

        showProjectModal: false,
        showScheduleModal: false,
        showPhotoModal: false,
        showDefectModal: false,
        showDocModal: false,

        // 滑動刪除手勢數據
        touchStartX: 0,
        swipedScheduleId: null,

        newProject: { name: '', contractAmount: null },
        newEntry: { type: 'expense', item: '', amount: null, date: new Date().toISOString().split('T')[0], partner: '' },
        newSchedule: { task: '', startDate: new Date().toISOString().split('T')[0], endDate: '', status: '未開始' },
        newPhoto: { category: '', date: new Date().toISOString().split('T')[0], url: '', note: '' },
        newDefect: { item: '', status: '待處理', note: '' },
        newDoc: { title: '', url: '', category: '工程文件' },

        async fetchData() {
          this.isLoading = true;
          try {
            const requestUrl = this.isClientOnly 
              ? `${API_URL}?action=getInitialData&mode=client` 
              : `${API_URL}?action=getInitialData`;

            let res = await fetch(requestUrl);
            let data = await res.json();
            this.projects = data.projects || [];
            this.entries = data.entries || [];
            this.schedules = data.schedules || [];
            this.photos = data.photos || [];
            this.defects = data.defects || [];
            this.documents = data.documents || [];

            if (this.projects.length > 0 && (!this.currentProject || !this.projects.find(p => String(p.id) === String(this.currentProject)))) {
              this.currentProject = String(this.projects[0].id);
            }
          } catch (e) {
            console.error("資料載入失敗:", e);
          } finally {
            this.isLoading = false;
          }
        },

        // 滑動手勢處理
        touchStart(e) {
          this.touchStartX = e.touches[0].clientX;
        },
        touchEnd(e, id) {
          const touchEndX = e.changedTouches[0].clientX;
          const diff = this.touchStartX - touchEndX;
          if (diff > 50) {
            this.swipedScheduleId = id; // 左滑拉出
          } else if (diff < -50) {
            this.swipedScheduleId = null; // 右滑收回
          }
        },

        getActiveProject() { 
          return this.projects.find(p => String(p.id) === String(this.currentProject)) || { contractAmount: 0, receivedAmount: 0 }; 
        },
        filteredEntries() { return this.entries.filter(i => String(i.projectId) === String(this.currentProject)).sort((a,b) => new Date(b.date)-new Date(a.date)); },
        filteredSchedules() { return this.schedules.filter(i => String(i.projectId) === String(this.currentProject)).sort((a,b) => new Date(a.startDate)-new Date(b.startDate)); },
        filteredPhotos() { return this.photos.filter(i => String(i.projectId) === String(this.currentProject)).sort((a,b) => new Date(b.date)-new Date(a.date)); },
        filteredDefects() { return this.defects.filter(i => String(i.projectId) === String(this.currentProject)); },
        filteredDocuments() { return this.documents.filter(i => String(i.projectId) === String(this.currentProject)); },

        calculateTotalExpenses() { return this.filteredEntries().filter(i => i.type === 'expense').reduce((s, i) => s + Number(i.amount), 0); },
        calculateProfit() { return this.getActiveProject().contractAmount - this.calculateTotalExpenses(); },
        calculateProfitMargin() {
          const contract = this.getActiveProject().contractAmount;
          if (!contract) return 0;
          return Math.round((this.calculateProfit() / contract) * 100);
        },

        handleFileUpload(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => { this.newPhoto.url = e.target.result; };
          reader.readAsDataURL(file);
        },

        async addProject() {
          this.isLoading = true;
          const id = String(Date.now());
          const p = { id, name: this.newProject.name, contractAmount: Number(this.newProject.contractAmount), receivedAmount: 0 };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addProject', data: p }) });
          this.projects.push(p);
          this.currentProject = id;
          this.showProjectModal = false;
          this.newProject.name = ''; this.newProject.contractAmount = null;
          this.isLoading = false;
        },

        async deleteCurrentProject() {
          const proj = this.getActiveProject();
          if (!proj.id) return alert("目前沒有選取的案場！");
          if (!confirm(`確定要刪除「${proj.name}」嗎？這個動作無法復原。`)) return;

          this.isLoading = true;
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteProject', id: String(proj.id) }) });
          this.projects = this.projects.filter(p => String(p.id) !== String(proj.id));
          if (this.projects.length > 0) {
            this.currentProject = String(this.projects[0].id);
          } else {
            this.currentProject = '';
          }
          this.isLoading = false;
        },

        async addEntry() {
          this.isLoading = true;
          const e = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newEntry };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addEntry', data: e }) });
          this.entries.push(e);
          if (e.type === 'income') this.getActiveProject().receivedAmount += Number(e.amount);
          this.newEntry.item = ''; this.newEntry.amount = null; this.newEntry.partner = '';
          this.isLoading = false;
        },

        async addSchedule() {
          this.isLoading = true;
          const s = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newSchedule };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addSchedule', data: s }) });
          this.schedules.push(s);
          this.showScheduleModal = false;
          this.isLoading = false;
        },

        async deleteSchedule(id) {
          if (!confirm("確定要刪除此工期嗎？")) return;
          this.isLoading = true;
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteSchedule', id: String(id) }) });
          this.schedules = this.schedules.filter(s => String(s.id) !== String(id));
          this.swipedScheduleId = null;
          this.isLoading = false;
        },

        async addPhoto() {
          this.isLoading = true;
          const p = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newPhoto };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPhoto', data: p }) });
          this.photos.push(p);
          this.showPhotoModal = false;
          this.newPhoto.url = '';
          this.isLoading = false;
        },

        async addDefect() {
          this.isLoading = true;
          const d = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newDefect, reply: '' };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addDefect', data: d }) });
          this.defects.push(d);
          this.showDefectModal = false;
          this.newDefect.item = ''; this.newDefect.note = '';
          this.isLoading = false;
        },

        async addDocument() {
          this.isLoading = true;
          const doc = { id: String(Date.now()), projectId: String(this.currentProject), ...this.newDoc };
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addDocument', data: doc }) });
          this.documents.push(doc);
          this.showDocModal = false;
          this.newDoc.title = ''; this.newDoc.url = '';
          this.isLoading = false;
        },

        async updateDefect(defect) {
          this.isLoading = true;
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateDefect', data: defect }) });
          this.isLoading = false;
          alert("狀態與回覆已成功更新！");
        },

        async deleteEntry(id) {
          if (!confirm("確定要刪除嗎？")) return;
          this.isLoading = true;
          await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteEntry', id: String(id) }) });
          this.entries = this.entries.filter(i => String(i.id) !== String(id));
          this.isLoading = false;
        },

        formatNumber(num) { return (Number(num) || 0).toLocaleString(); },
        formatDate(dStr) {
          if (!dStr) return '';
          const d = new Date(dStr);
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
      };
    }
  </script>
</body>
</html>
